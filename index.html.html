<style>

</style></head><body><div class="w">
<h1>Delhi Sultanate: GA Quiz (SSC CGL level)</h1>
<p class="sub">30 questions (incl. 5 statement-based) · Moderate to hard · Tap an option to see the answer and a quick solution.</p>
<div class="bar"><span id="p">Answered 0/30</span><div class="pr"><i id="pb"></i></div><span id="sc">Score 0</span></div>
<div id="qs"></div>

<script>
// Correct option is listed first; options are rotated on load.
var D=[
["Taj-ul-Maasir, a chronicle of the reigns of Aibak and early Iltutmish, was written by:",["Hasan Nizami","Minhaj-us-Siraj","Ziauddin Barani","Isami"],"Hasan Nizami wrote Taj-ul-Maasir. Minhaj wrote Tabaqat-i-Nasiri; Barani wrote Tarikh-i-Firoz Shahi."],
["In 1229 Iltutmish received a letter of investiture and robe of honour from which Abbasid Caliph?",["Al-Mustansir","Al-Mutasim","Al-Mamun","Harun al-Rashid"],"Caliph Al-Mustansir’s recognition legitimised Iltutmish as a sovereign Sultan."],
["Sultan Ghari (c. 1231), regarded as the first Islamic mausoleum in India, is the tomb of:",["Prince Nasiruddin Mahmud, son of Iltutmish","Iltutmish","Razia Sultan","Balban"],"Iltutmish built it at Delhi’s Mehrauli area for his eldest son."],
["Which rebellious governor of Tabarhind (Bhatinda) did Razia Sultan marry after being defeated by him?",["Malik Altunia","Jamaluddin Yaqut","Malik Ayaz","Ulugh Khan Balban"],"Altunia revolted; Razia lost, married him, and both were killed near Kaithal in 1240. Yaqut was her Abyssinian favourite."],
["The military department Diwan-i-Arz was established by:",["Balban","Iltutmish","Alauddin Khalji","Firoz Shah Tughlaq"],"Balban reorganised the army and set up Diwan-i-Arz; he also adopted Sijda and Paibos in court."],
["In 1299 a Mongol army under Qutlugh Khwaja threatened Delhi. Which general of Alauddin Khalji died fighting heroically in this battle?",["Zafar Khan","Nusrat Khan","Malik Kafur","Ghazi Malik"],"Zafar Khan’s charge at Kili saved Delhi, but he was killed. Alauddin later built Siri as a fortified city."],
["Dagh (branding of horses) and Chehra (descriptive roll of soldiers) were introduced by:",["Alauddin Khalji","Iltutmish","Balban","Muhammad bin Tughlaq"],"Introduced to curb fraud in the standing army (the Mustering system)."],
["Under Alauddin Khalji’s market reforms, Diwan-i-Riyasat was concerned with:",["Regulation of merchants and market prices","Agricultural development","Charity and pensions","Recruitment of slaves"],"Diwan-i-Riyasat controlled merchants; Shahna-i-Mandi supervised each market."],
["The Padmavat, linked to Alauddin’s 1303 siege of Chittor, was composed by:",["Malik Muhammad Jayasi","Amir Khusrau","Tulsidas","Abdur Rahim Khan-i-Khanan"],"Jayasi wrote Padmavat in Awadhi (c. 1540); it is a literary work, not a contemporary chronicle."],
["Khazain-ul-Futuh, describing Alauddin Khalji’s conquests, was written by:",["Amir Khusrau","Hasan Nizami","Ziauddin Barani","Ibn Battuta"],"Khusrau also wrote Ashiqa and was called Tuti-i-Hind."],
["Which Sultan assumed the title Khalifat-ullah and declared himself the Caliph?",["Qutbuddin Mubarak Shah Khalji","Alauddin Khalji","Muhammad bin Tughlaq","Firoz Shah Tughlaq"],"Mubarak Shah dropped allegiance to the Abbasid Caliph and styled himself Al-Wathiq Billah."],
["Alai Darwaza (1311), a gem of early Indo-Islamic architecture, was built by:",["Alauddin Khalji","Iltutmish","Ghiyasuddin Tughlaq","Firoz Shah Tughlaq"],"It is the gateway of the Qutb complex, noted for the first scientific use of true arch and dome."],
["Diwan-i-Kohi, a department for agricultural development, was set up by:",["Muhammad bin Tughlaq","Firoz Shah Tughlaq","Balban","Sikandar Lodi"],"Part of his agrarian scheme, which largely failed due to famine and poor execution."],
["Muhammad bin Tughlaq’s token currency (1329–30) used coins of:",["Copper/brass (bronze)","Leather","Paper","Gold"],"Token coins were valued at silver tanka rates; forgery was widespread and they were withdrawn."],
["The Moroccan traveller Ibn Battuta served as qazi (judge) of Delhi under:",["Muhammad bin Tughlaq","Firoz Shah Tughlaq","Alauddin Khalji","Sikandar Lodi"],"His account is the Rihla; he was later sent as ambassador to China."],
["Firoz Shah Tughlaq brought Ashokan pillars to Delhi from:",["Topra and Meerut","Sarnath and Lumbini","Sanchi and Gaya","Kausambi and Vaishali"],"They were set up at Firozabad (Kotla) and the Delhi Ridge."],
["Which department of Firoz Shah Tughlaq looked after the royal slaves?",["Diwan-i-Bandagan","Diwan-i-Khairat","Diwan-i-Mustakhraj","Diwan-i-Kohi"],"Diwan-i-Khairat dealt with charity and marriage aid; Diwan-i-Mustakhraj with arrears of revenue."],
["Timur’s invasion of India in 1398 took place during the reign of:",["Nasiruddin Mahmud Shah Tughlaq","Muhammad bin Tughlaq","Firoz Shah Tughlaq","Khizr Khan"],"Timur sacked Delhi, weakening the Tughlaqs; Khizr Khan later founded the Sayyid dynasty."],
["Khizr Khan, founder of the Sayyid dynasty, did not call himself Sultan but used the title:",["Rayat-i-Ala","Zill-i-Ilahi","Sikandar-i-Sani","Amir-ul-Umara"],"He ruled as Timur’s nominee and sent tribute to Timur’s successors."],
["Agra was founded in 1504 by:",["Sikandar Lodi","Bahlul Lodi","Ibrahim Lodi","Khizr Khan"],"Sikandar Lodi also introduced the Gaz-i-Sikandari (measure of land)."],
["Which Punjab governor of Ibrahim Lodi, along with Alam Khan, invited Babur to India?",["Daulat Khan Lodi","Hasan Khan Mewati","Mahmud Lodi","Bahadur Khan"],"This led to the First Battle of Panipat (1526), ending the Delhi Sultanate."],
["Muhammad Ghori defeated the Gahadavala ruler Jaichandra in the Battle of:",["Chandawar (1194)","Tarain (1192)","Khanwa (1527)","Chausa (1539)"],"Tarain (1192) was against Prithviraj Chauhan; Chandawar, near Etawah, opened the Gangetic plain."],
["Around 1204, Bakhtiyar Khalji captured Nadia, the capital of:",["Lakshmana Sena","Govindachandra","Jaichandra","Bhima II"],"Bakhtiyar also destroyed the Nalanda and Odantapuri monasteries (c. 1200)."],
["Futuh-us-Salatin, a Persian verse history composed in the Deccan (1350), is by:",["Isami","Ziauddin Barani","Amir Khusrau","Minhaj-us-Siraj"],"Isami wrote it under the Bahmani Sultan Alauddin Bahman Shah."],
["The corps of forty Turkish nobles, Turkan-i-Chahalgani, was organised by ___ and destroyed by ___:",["Iltutmish; Balban","Aibak; Iltutmish","Balban; Alauddin Khalji","Razia; Balban"],"Balban curbed the Chahalgani to strengthen the monarchy (‘blood and iron’ policy)."],
["<b>Statement-based.</b> Consider the statements:<br>1. Iltutmish introduced the silver tanka and the copper jital as standard coins.<br>2. Balban introduced the Dagh (branding of horses) system.<br>Which is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"Statement 1 is correct. Statement 2 is wrong: Dagh was introduced by Alauddin Khalji.",0],
["<b>Statement-based.</b> Consider the statements:<br>1. Alauddin Khalji fixed the prices of grain, cloth, horses, slaves and cattle in Delhi.<br>2. Alauddin Khalji paid his soldiers in cash rather than through iqta grants.<br>Which is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"Both are correct. Cash salaries (about 234 tankas per soldier) were the reason for price control.",2],
["<b>Statement-based.</b> Consider the statements:<br>1. Ibn Battuta visited India during the reign of Firoz Shah Tughlaq.<br>2. Ibn Battuta’s travel account is known as the Rihla.<br>Which is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"Statement 1 is wrong: he came during Muhammad bin Tughlaq’s reign. Statement 2 is correct.",1],
["<b>Statement-based.</b> Consider the statements:<br>1. The Lodi dynasty was founded by Sikandar Lodi.<br>2. Bahlul Lodi founded the city of Agra.<br>Which is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"Both are wrong: Bahlul Lodi founded the dynasty (1451), and Sikandar Lodi founded Agra (1504).",3],
["<b>Statement-based.</b> Consider the statements:<br>1. Sikandar Lodi introduced the Gaz-i-Sikandari for measuring land.<br>2. Bahlul Lodi was the first Afghan ruler to occupy the throne of Delhi.<br>Which is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"Both are correct. Bahlul’s Lodi dynasty (1451) was the first Afghan dynasty of Delhi.",2]
];
var L="ABCD",st={},S=0,A=0,box=document.getElementById("qs");
D.forEach(function(d,i){
 var k=(i*3+1)%4,o=d[1].map(function(t,j){return{t:t,c:j===0}});
 if(d[3]!==undefined){o=d[1].map(function(t,j){return{t:t,c:j===d[3]}})}else{o=o.slice(k).concat(o.slice(0,k))}
 var c=document.createElement("div");c.className="q";
 c.innerHTML='<p class="qt"><b class="n">Q'+(i+1)+'.</b> '+d[0]+'</p>';
 var e=document.createElement("div");e.className="e";e.innerHTML="<b>Solution:</b> "+d[2];
 var bs=[];
 o.forEach(function(x,j){
  var b=document.createElement("button");b.className="o";b.textContent=L[j]+") "+x.t;
  b.onclick=function(){
   if(st[i]!==undefined)return;
   st[i]=x.c;A++;if(x.c)S++;
   bs.forEach(function(y,m){y.disabled=true;if(o[m].c)y.classList.add("ok")});
   if(!x.c)b.classList.add("no");
   e.classList.add("s");upd();
  };
  bs.push(b);c.appendChild(b);
 });
 c.appendChild(e);box.appendChild(c);
});
function upd(){
 document.getElementById("p").textContent="Answered "+A+"/"+D.length;
 document.getElementById("sc").textContent="Score "+S;
 document.getElementById("pb").style.width=(A/D.length*100)+"%";
}
document.getElementById("fin").onclick=function(){
 var r=document.getElementById("res"),w=A-S,u=D.length-A,m=S>=24?"Excellent work!":S>=18?"Good, keep revising.":"Revise the Sultanate dynasties and administration, then retry.";
 r.innerHTML="<h2>"+S+" / "+D.length+"</h2><p>Correct: "+S+" · Wrong: "+w+" · Skipped: "+u+"<br>"+m+"</p>";
 r.classList.add("s");r.scrollIntoView({behavior:"smooth"});
};
document.getElementById("rs").onclick=function(){location.reload()};
</script></body></html>
